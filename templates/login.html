<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Observer - Sign in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="js/jquery-2.2.0.min.js"></script>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width:420px; margin-top:80px">
        <h3>Observer</h3>
        <form id="login-form" autocomplete="off">
            <div>Please sign in to continue:</div>
            <input id="password-field" type="password" class="form-control" placeholder="Password" autofocus>
            <input id="next-url" type="hidden" value="{{ next_url }}">
            <button type="submit" class="btn btn-default" style="margin-top:10px">Sign in</button>
            <div id="login-error" class="text-danger" style="margin-top:10px"></div>
        </form>
    </div>
    <script src="js/login.js"></script>
</body>
</html>

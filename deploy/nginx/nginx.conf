# TLS reverse proxy for Observer (Compose profile "tls").
#   https://HOST:PORT/      -> dashboard (9000)
#   /_live, /_compute       -> live (9002) and compute (9003) services, same origin as the page
#   TLS on :8890 (TCP)      -> agent listener (8889): agents connect with OBSERVER_AGENT_TLS=1
# X-Forwarded-For is overwritten (not appended) with the address nginx saw, so a client cannot supply its own.
worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 5m;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        location = /_live    { proxy_pass http://live:9002/live; }
        location = /_compute { proxy_pass http://compute:9003/compute; }
        location /           { proxy_pass http://dash:9000; }
    }
}

stream {
    server {
        listen 8890 ssl;
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass listener:8889;
        proxy_timeout 1h;
    }
}
